<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>بازی رنگ‌ها</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        button {
            padding: 20px 40px;
            font-size: 1.5em;
            background-color: #FF6347;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #4682B4;
        }
    </style>
</head>
<body>
    <h1>دکمه رو کلیک کن!</h1>
    <button onclick="this.style.backgroundColor='#2ECC71'">کلیک کن</button>
</body>
</html>
